<!-- Scan Tab -->
<section x-data="scan" x-show="currentTab==='scan'">
  <article>
    <header>
      <h1>WiFi 扫描</h1>
    </header>
    <div style="display:flex;gap:1rem;align-items:center;flex-wrap:wrap;">
      <button @click="startScan" :aria-busy="scanning" :disabled="scanning" class="contrast" style="min-width:10rem;">
        <span x-text="scanning ? '扫描中...' : '开始扫描'"></span>
      </button>
      <label>
        <input type="checkbox" x-model="persistEnabled" @change="savePersisted" role="switch"> 持久记录
      </label>
    </div>

    <p x-show="scanError" role="alert" class="error" x-text="scanError"></p>

    <div x-show="scanResults.length > 0" style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>SSID</th>
            <th>BSSID</th>
            <th>信号</th>
            <th>信道</th>
            <th>频段</th>
            <th>加密</th>
            <th>最后出现</th>
            <th>操作</th>
          </tr>
        </thead>
        <template x-for="ap in scanResults" :key="ap.bssid">
          <tbody x-data="{ expanded: true }">
            <tr>
              <td x-text="ap.ssid || '(隐藏)'"></td>
              <td>
                <span style="font-family:monospace;font-size:0.85em;cursor:pointer" @click="openMacLookup(ap.bssid)"
                  x-text="ap.bssid"></span>
              </td>
              <td x-text="ap.rssi + ' dBm'" :style="'color:' + rssiColor(ap.rssi) + ';font-weight:bold;'"></td>
              <td x-text="ap.channel"></td>
              <td x-text="ap.band"></td>
              <td x-text="ap.security"></td>
              <td style="font-size:0.85em;" x-text="ap.lastSeen"></td>
              <td>
                <button @click="deviceScanning === ap.bssid ? stopDeviceScan(ap.bssid) : startDeviceScan(ap.bssid, ap.channel)"
                  :aria-busy="deviceScanning === ap.bssid"
                  :disabled="deviceScanning !== null && deviceScanning !== ap.bssid" class="outline contrast"
                  style="padding:0.25rem 0.75rem;font-size:0.85rem;">
                  <span x-text="deviceScanning === ap.bssid ? '停止监听' : '扫描设备'"></span>
                </button>
              </td>
            </tr>
            <!-- Device scan results for this AP -->
            <tr x-show="deviceResults[ap.bssid]?.length > 0">
              <td colspan="8" style="padding:0;background:var(--card-background-color, #f8f9fa);">
                <div style="padding:0.5rem 1rem;">
                  <div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;margin-bottom:0.25rem;" @click="expanded = !expanded">
                    <small><strong>发现的设备 (<span x-text="deviceResults[ap.bssid]?.length"></span>)</strong></small>
                    <span style="font-size:0.85em;color:var(--muted-color);display:inline-flex;align-items:center;gap:0.25rem;">
                      <span x-text="expanded ? '折叠' : '展开'"></span>
                      <load src="src/assets/chevron-up.svg" />
                    </span>
                  </div>
                  <div x-show="expanded" x-transition>
                    <table style="margin-top:0.4em;font-size:0.85em;">
                      <thead>
                        <tr>
                          <th>MAC</th>
                          <th>数据包</th>
                          <th>最后出现</th>
                        </tr>
                      </thead>
                      <tbody>
                        <template x-for="dev in deviceResults[ap.bssid]" :key="dev.mac">
                          <tr>
                            <td><span style="font-family:monospace;cursor:pointer" @click="openMacLookup(dev.mac)"
                                x-text="dev.mac"></span></td>
                            <td x-text="dev.packets"></td>
                            <td x-text="dev.lastSeen"></td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </div>
              </td>
            </tr>
            <!-- Error row -->
            <tr x-show="deviceErrors[ap.bssid]">
              <td colspan="8" style="padding:0.25rem 1rem;color:var(--del-color,#c0392b);font-size:0.85em;">
                <span x-text="deviceErrors[ap.bssid]"></span>
              </td>
            </tr>
          </tbody>
        </template>
      </table>
    </div>

    <footer>
      <small x-show="scanResultCount !== null" x-text="'发现 ' + scanResultCount + ' 个网络'"></small>
      <small x-show="scanResultCount === null">扫描大致耗时5-10秒</small>
    </footer>
  </article>
</section>
