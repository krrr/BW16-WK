<!DOCTYPE html>
<html lang="zh-CN" x-data="app">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BW16 WiFi Killer</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon"/>
</head>
<body>
  <main class="container">
    <nav class="container-fluid" style="margin-top: 1rem;">
      <ul>
      <li><strong>BW16 WiFi Killer</strong></li>
      </ul>
      <ul>
        <li><a href="#" @click.prevent="currentTab='home'" :class="{contrast: currentTab==='home'}">首页</a></li>
        <li><a href="#" @click.prevent="currentTab='scan'" :class="{contrast: currentTab==='scan'}">扫描</a></li>
      </ul>
    </nav>

    <!-- Home Tab -->
    <section x-show="currentTab==='home'">
      <article>
        <header>
          <h1>状态</h1>
        </header>
        <p x-text="'运行时间: ' + uptime + 's'"></p>
        <p x-show="compileDate" x-text="'固件编译: ' + compileDate + ' ' + compileTime"></p>
        <footer>
          <small>by <a href="https://github.com/krrr" target="_blank">krrr</a></small>
        </footer>
      </article>
    </section>

    <!-- Scan Tab -->
    <section x-show="currentTab==='scan'">
      <article>
        <header>
          <h1>WiFi 扫描</h1>
        </header>
        <div style="display:flex;gap:1rem;align-items:center;flex-wrap:wrap;">
          <button @click="startScan" :aria-busy="scanning" :disabled="scanning" class="contrast" style="min-width:10rem;">
            <span x-text="scanning ? '扫描中...' : '开始扫描'"></span>
          </button>
        </div>

        <p x-show="scanError" role="alert" class="error" x-text="scanError"></p>

        <div x-show="scanResults.length > 0" style="overflow-x:auto;">
          <table>
            <thead>
              <tr>
                <th>SSID</th>
                <th>BSSID</th>
                <th>信号</th>
                <th>信道</th>
                <th>频段</th>
                <th>加密</th>
                <th>最后出现时间</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody>
              <template x-for="ap in scanResults" :key="ap.bssid">
                <tr>
                  <td x-text="ap.ssid || '(隐藏)'"></td>
                  <td>
                    <span style="font-family:monospace;font-size:0.85em;cursor:pointer" @click="openMacLookup(ap.bssid)" x-text="ap.bssid"></span>
                  </td>
                  <td x-text="ap.rssi + ' dBm'" :style="'color:' + rssiColor(ap.rssi) + ';font-weight:bold;'"></td>
                  <td x-text="ap.channel"></td>
                  <td x-text="ap.band"></td>
                  <td x-text="ap.security"></td>
                  <td style="font-size:0.85em;" x-text="ap.lastSeen"></td>
                  <td>
                    <button @click="startDeviceScan(ap.bssid, ap.channel)"
                      :aria-busy="deviceScanning === ap.bssid"
                      :disabled="deviceScanning !== null"
                      class="outline contrast"
                      style="padding:0.25rem 0.75rem;font-size:0.85rem;">
                      <span x-text="deviceScanning === ap.bssid ? '监听中...' : (deviceCount(ap.bssid) > 0 ? '设备(' + deviceCount(ap.bssid) + ')' : '扫描设备')"></span>
                    </button>
                  </td>
                </tr>
                <!-- Device scan results for this AP -->
                <tr x-show="deviceResults[ap.bssid] && deviceResults[ap.bssid].length > 0">
                  <td colspan="8" style="padding:0;background:var(--card-background-color, #f8f9fa);">
                    <div style="padding:0.5rem 1rem;">
                      <small><strong>发现的设备 (<span x-text="deviceResults[ap.bssid].length"></span>)</strong></small>
                      <table style="margin:0.25rem 0 0 0;font-size:0.85em;">
                        <thead>
                          <tr>
                            <th>MAC</th>
                            <th>信号</th>
                            <th>数据包</th>
                          </tr>
                        </thead>
                        <tbody>
                          <template x-for="dev in deviceResults[ap.bssid]" :key="dev.mac">
                            <tr>
                              <td><span style="font-family:monospace;cursor:pointer" @click="openMacLookup(dev.mac)" x-text="dev.mac"></span></td>
                              <td x-text="dev.rssi + ' dBm'" :style="'color:' + rssiColor(dev.rssi) + ';font-weight:bold;'"></td>
                              <td x-text="dev.packets"></td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                  </td>
                </tr>
                <!-- Error row -->
                <tr x-show="deviceErrors[ap.bssid]">
                  <td colspan="8" style="padding:0.25rem 1rem;color:var(--del-color,#c0392b);font-size:0.85em;">
                    <span x-text="deviceErrors[ap.bssid]"></span>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>

        <footer>
          <small x-show="scanResultCount !== null" x-text="'发现 ' + scanResultCount + ' 个网络'"></small>
          <small x-show="scanResultCount === null">扫描大致耗时5-10秒</small>
        </footer>
      </article>
    </section>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
