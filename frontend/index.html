<!DOCTYPE html>
<html lang="zh-CN" x-data="app">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BW16 WiFi Killer</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon"/>
</head>
<body>
  <main class="container">
    <nav class="container-fluid" style="margin-top: 1rem;">
      <ul>
      <li><strong>BW16 WiFi Killer</strong></li>
      </ul>
      <ul>
        <li><a href="#" @click.prevent="currentTab='home'" :class="{contrast: currentTab==='home'}">首页</a></li>
        <li><a href="#" @click.prevent="currentTab='scan'" :class="{contrast: currentTab==='scan'}">扫描</a></li>
      </ul>
    </nav>

    <!-- Home Tab -->
    <section x-show="currentTab==='home'">
      <article>
        <header>
          <h1>状态</h1>
        </header>
        <p x-text="'当前信道: ' + apChannel"></p>
        <p x-text="'运行时间: ' + formattedUptime"></p>
        <p x-show="compileDate" x-text="'固件编译: ' + compileDate"></p>
        <p>
          RTC 时间: <span x-text="rtcTime ? rtcTime.toLocaleString('zh-CN') : '未设置'"></span>
          <span x-show="timeDiff !== null && timeDiff > 30" style="color:var(--del-color,#c0392b);font-size:0.9em;">
            (偏差 <span x-text="Math.round(timeDiff)"></span> 秒)
          </span>
          <button x-show="timeDiff !== null && timeDiff > 30" @click="syncTime" class="outline contrast" style="padding:0.15rem 0.6rem;font-size:0.8rem;vertical-align:middle;margin-left:0.4rem;">同步时间</button>
        </p>
        <footer>
          <small>by <a href="https://github.com/krrr" target="_blank">krrr</a></small>
        </footer>
      </article>
    </section>

    <load src="src/tabs/scan.html" />
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
